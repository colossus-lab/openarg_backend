name: Test Suite

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
  push:
    branches: [ main, staging ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'mcp_publico/**'
      - 'pyproject.toml'
      - 'alembic.ini'
      - 'config/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, staging ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'mcp_publico/**'
      - 'pyproject.toml'
      - 'alembic.ini'
      - 'config/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openarg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install -e '.[dev,test]' --system

    - name: Run linting
      run: |
        ruff check src/ tests/
        ruff format src/ tests/ --check
        python -m scripts.ci.validate_curated_sources --no-network

    - name: Run unit tests
      env:
        APP_ENV: test
        DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/openarg_test
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/1
        REDIS_CACHE_URL: redis://localhost:6379/2
      run: |
        pytest tests/unit/ -q --no-header --maxfail=5 --tb=short

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    timeout-minutes: 20

    # Postgres is NOT a `services:` container here. The migrations need both
    # `vector` and `postgis`, and no published image carries both: the
    # `pgvector/pgvector` image has no PostGIS and the `postgis/postgis` one
    # has no pgvector. `services:` cannot build, so the database is started as
    # an ordinary container in a step below. Before this, CI ran the
    # integration suite against a migrated-but-empty database and 45 of its 80
    # tests skipped themselves — coverage that looked green and protected
    # nothing.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install -e '.[dev,test]' --system

    - name: Start Postgres with pgvector + PostGIS
      run: |
        docker build -t openarg-ci-db - <<'DOCKERFILE'
        FROM pgvector/pgvector:pg16
        RUN apt-get update \
         && apt-get install -y --no-install-recommends postgresql-16-postgis-3 \
         && rm -rf /var/lib/apt/lists/*
        DOCKERFILE
        docker run -d --name openarg-ci-db \
          -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=openarg_test -p 5432:5432 openarg-ci-db
        for _ in $(seq 1 40); do
          docker exec openarg-ci-db pg_isready -U postgres >/dev/null 2>&1 && break
          sleep 2
        done
        docker exec openarg-ci-db pg_isready -U postgres

    - name: Apply migrations
      env:
        APP_ENV: test
        DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/openarg_test
      run: |
        alembic -c alembic.ini upgrade head

    - name: Run integration tests
      env:
        APP_ENV: test
        DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/openarg_test
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/1
        REDIS_CACHE_URL: redis://localhost:6379/2
      run: |
        # Re-emit each failure as a workflow annotation. Job logs need a token
        # to read through the API, so a red run used to say only "exit code 1"
        # to anyone without one — which is how this job stayed red for days
        # without anybody being able to see what broke.
        # `pipefail` so the pipeline carries pytest's status and not tee's —
        # without it a failing run reports success.
        set -o pipefail
        status=0
        pytest tests/integration/ -q --no-header --maxfail=5 --tb=short \
          2>&1 | tee /tmp/integration.log || status=$?
        # `|| true` matters: with `pipefail` on and the runner's `set -e`, a
        # grep that finds nothing returns 1 and kills the step — which turned
        # a green suite into a red job and cost a run to notice.
        grep -E '^(FAILED|ERROR)' /tmp/integration.log > /tmp/failures.txt || true
        while read -r line; do
          echo "::error::${line}"
        done < /tmp/failures.txt
        # When pytest fails without naming a test — a collection error, a
        # crash, a usage error — the lines above are empty and the annotation
        # would say nothing. Emit the tail so the run is never mute.
        if [ "${status}" -ne 0 ] && [ ! -s /tmp/failures.txt ]; then
          echo "::error::pytest exited ${status} without naming a test; last lines follow"
          tail -n 15 /tmp/integration.log | while read -r line; do
            echo "::error::${line}"
          done
        fi
        exit "${status}"

  mcp-publico-tests:
    runs-on: ubuntu-latest
    name: MCP público
    timeout-minutes: 10

    # El SDK de MCP no está en pyproject.toml: es dependencia sólo del
    # contenedor del MCP público (mcp_publico/requirements.txt). Sin él,
    # `test_mcp_publico_server.py` se saltea entero con `importorskip` y el
    # job de unit tests queda verde sin haber probado el servidor: autenticación,
    # cupos, las herramientas, robots.txt. Este job instala exactamente lo que
    # instala el contenedor y falla si algo se saltea.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install MCP container dependencies
      run: |
        uv pip install --system -r mcp_publico/requirements.txt \
          'pytest>=8.3.0' 'pytest-asyncio>=0.24.0'
        python -c "import mcp, mcp_publico.server"

    - name: Run MCP tests
      run: |
        set -o pipefail
        pytest tests/unit/test_mcp_publico_server.py tests/unit/test_mcp_publico_core.py \
          -q --no-header --tb=short -rs 2>&1 | tee /tmp/mcp.log
        # Un skip acá es el mismo agujero que este job viene a tapar.
        if grep -qE '[0-9]+ skipped' /tmp/mcp.log; then
          echo "::error::Se saltearon tests del MCP público; ver el resumen -rs arriba"
          exit 1
        fi

  type-check:
    runs-on: ubuntu-latest
    name: Type Checking
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install -e '.[dev,test]' --system

    - name: Run mypy
      continue-on-error: true
      run: |
        mypy src/
