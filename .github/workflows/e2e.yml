name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests (Staging DB)
    # 120 alcanzaban cuando los tests morían en 2 s contra un pipeline roto.
    # Con el pipeline andando, cada uno es una consulta real: la corrida del
    # 2026-09-28 se canceló por timeout al 85%, justo antes del resumen.
    timeout-minutes: 180

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install -e '.[dev,test]' --system

    # Este workflow falló en TODAS las corridas de `main` desde el 2026-08-01,
    # y lo que se veía era `connection to localhost:5432 failed` en el paso
    # siguiente — que se lee como un problema de base cuando en realidad el
    # túnel nunca se levantó. Cinco meses de una señal en rojo que nadie miró
    # porque no decía dónde se rompía.
    #
    # Tres cambios para que falle donde se rompe:
    #   - los secrets se validan antes de usarse y el error nombra cuál falta;
    #   - `ExitOnForwardFailure=yes`: sin eso `ssh -f -N` queda vivo aunque el
    #     forward no se haya establecido, y este paso pasa en verde;
    #   - la espera hace un handshake de Postgres, no un `connect()` a secas:
    #     el listener local de un túnel SSH acepta la conexión TCP **siempre**,
    #     aunque el otro extremo no exista, así que abrir el socket no prueba
    #     nada. (Primera versión de este arreglo cometió justamente ese error.)
    #
    # Y antes de abrir el túnel se comprueba, desde la propia EC2, que el
    # destino del forward sea alcanzable. Eso separa dos fallas que hasta ahora
    # se veían igual: el secret que apunta a un host equivocado, y la base que
    # no responde.
    - name: Check required secrets
      run: |
        faltan=""
        [ -n "${{ secrets.STAGING_SSH_KEY }}" ] || faltan="$faltan STAGING_SSH_KEY"
        [ -n "${{ secrets.STAGING_HOST }}" ] || faltan="$faltan STAGING_HOST"
        [ -n "${{ secrets.STAGING_DB_HOST }}" ] || faltan="$faltan STAGING_DB_HOST"
        [ -n "${{ secrets.STAGING_DB_PASSWORD }}" ] || faltan="$faltan STAGING_DB_PASSWORD"
        if [ -n "$faltan" ]; then
          echo "::error::Faltan secrets:$faltan — el E2E corre contra la base de staging y no puede seguir."
          exit 1
        fi
        echo "Todos los secrets requeridos están definidos."

    - name: Set up SSH tunnel to staging DB
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
        chmod 600 ~/.ssh/staging_key

        # ¿La EC2 alcanza el destino del forward? Si no, el secret apunta a un
        # host que ya no existe y el túnel "se abre" igual: el listener local
        # queda arriba y la falla aparece recién al primer query.
        if ! ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
          ec2-user@${{ secrets.STAGING_HOST }} \
          "timeout 8 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.STAGING_DB_HOST }}/5432'"; then
          echo "::error::La EC2 de staging no alcanza STAGING_DB_HOST:5432. El secret apunta a un host equivocado o el security group del RDS ya no habilita a la EC2. (STAGING_DB_HOST se cargó el 2026-03-22.)"
          exit 1
        fi
        echo "La EC2 alcanza el destino del forward."

        # Tunnel: localhost:5432 -> staging EC2 -> RDS:5432
        if ! ssh -f -N -L 5432:${{ secrets.STAGING_DB_HOST }}:5432 \
          -i ~/.ssh/staging_key \
          -o StrictHostKeyChecking=no \
          -o ExitOnForwardFailure=yes \
          -o ConnectTimeout=20 \
          -o ServerAliveInterval=30 \
          ec2-user@${{ secrets.STAGING_HOST }}; then
          echo "::error::No se pudo abrir el túnel SSH a staging. Revisar STAGING_HOST, STAGING_SSH_KEY y que el security group siga habilitando al runner."
          exit 1
        fi

        # Handshake real contra Postgres a través del túnel. Abrir el socket no
        # alcanza: el listener del forward acepta cualquier conexión.
        for i in $(seq 1 20); do
          if PGPASSWORD='${{ secrets.STAGING_DB_PASSWORD }}' python -c "
        import os, sys, psycopg
        try:
            with psycopg.connect(
                host='127.0.0.1', port=5432, dbname='openarg_staging',
                user='openarg', password=os.environ['PGPASSWORD'], connect_timeout=5,
            ) as c:
                c.execute('SELECT 1')
        except Exception as e:
            print(f'  todavía no: {type(e).__name__}: {str(e)[:120]}')
            sys.exit(1)
        "; then
            echo "SSH tunnel ready — Postgres responde a través del túnel"
            exit 0
          fi
          sleep 2
        done

        echo "::error::El túnel está abierto y la EC2 alcanza el destino, pero Postgres no responde a través del túnel. Revisar STAGING_DB_PASSWORD y que la base openarg_staging exista."
        exit 1

    - name: Flush caches before E2E
      env:
        DATABASE_URL: postgresql+psycopg://openarg:${{ secrets.STAGING_DB_PASSWORD }}@localhost:5432/openarg_staging
      run: |
        python -c "
        import asyncio
        from sqlalchemy.ext.asyncio import create_async_engine
        from sqlalchemy import text
        async def flush():
            engine = create_async_engine('$DATABASE_URL')
            async with engine.begin() as conn:
                r = await conn.execute(text('DELETE FROM query_cache'))
                print(f'Flushed {r.rowcount} query_cache entries')
            await engine.dispose()
        asyncio.run(flush())
        "
        redis-cli -h localhost -p 6379 FLUSHALL || true
        echo "Caches flushed"

    - name: Run E2E tests
      env:
        APP_ENV: e2e
        DATABASE_URL: postgresql+psycopg://openarg:${{ secrets.STAGING_DB_PASSWORD }}@localhost:5432/openarg_staging
        SANDBOX_DATABASE_URL: postgresql+psycopg://openarg:${{ secrets.STAGING_DB_PASSWORD }}@localhost:5432/openarg_staging
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/1
        REDIS_CACHE_URL: redis://localhost:6379/2
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: us-east-1
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      run: |
        # `--reruns 1` y no 2. Los reruns existen porque el LLM no es
        # determinista, pero multiplican: un test que falla corre 1+N veces, y
        # cada corrida es una consulta real de 10-30 s contra Bedrock.
        #
        # Mientras el pipeline estuvo roto esto no se notaba: los tests morían
        # en ~2 s con un 500 y la suite entera entraba en 26 minutos. Con el
        # pipeline andando, la corrida del 2026-09-28 se comió los 120 minutos
        # del job y quedó cancelada al 85%, sin llegar a imprimir el resumen —
        # o sea, sin decir nada de por qué fallaba cada test.
        #
        # Un rerun sigue absorbiendo el flakeo de una consulta suelta; el
        # segundo sólo compraba tiempo y tokens.
        pytest tests/e2e/ -v --tb=short --timeout=300 --reruns 1 --reruns-delay 5 -m e2e -o "addopts="

    - name: Cleanup SSH tunnel
      if: always()
      run: |
        pkill -f "ssh.*-L 5432" || true
