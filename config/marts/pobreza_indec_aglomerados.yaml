id: pobreza_indec_aglomerados
version: 0.2.0
description: |
  Incidencia semestral de la pobreza y la indigencia en hogares y personas,
  total de los 31 aglomerados urbanos, publicada por INDEC en su Informe
  Técnico (Cuadro 1). Desde el 2do semestre de 2016.

  La tabla raw viene TIME-PIVOTED (un período por columna). Este mart hace
  UNPIVOT en SQL via `CROSS JOIN LATERAL VALUES` para exponer formato long:
  (indicador, periodo, valor).

  `indicador` vale `Hogares` o `Personas`, tanto para pobreza como para
  indigencia: el Excel los separa con una fila de título, sin dato, que el
  `IS NOT NULL` de abajo descarta. Cada par (indicador, periodo) tiene dos
  filas, y la menor es la de indigencia.
domain: economia

sources:
  portals: [indec]
  resource_patterns:
    - "indec::*pobreza_informe_cuadro_1"

canonical_columns:
  - name: indicador
    type: text
    description: Nombre del indicador de pobreza/indigencia (`Indicador` en raw)
  - name: periodo
    type: text
    description: Semestre del registro (e.g. `2do. semestre 2016`, `1er. semestre 2025`)
  - name: valor
    type: numeric
    description: Valor publicado por INDEC para ese (indicador, período). Texto porque el upstream mezcla números y notas como `(1)` o `s/d`.

sql: |
  -- UNPIVOT explícito de los períodos columna → fila. Los nombres tienen
  -- variantes ortográficas (`1er semestre 2020` sin punto) que reflejan los
  -- headers del Excel original — los preservamos AS-IS para auditabilidad.
  --
  -- Lee la hoja por su nombre. Antes matcheaba las 17 `indec__…informe_de_pobreza…`,
  -- que el colector había llenado con la primera hoja del archivo: daba bien por
  -- esa casualidad, y quedó congelado en la edición de mayo. Hoy esas tablas no
  -- se escriben más (`application/catalog/carga_propia.py`).
  WITH src AS (
    SELECT * FROM {{ live_tables_by_table_pattern(
        'cache_indec_pobreza_informe_cuadro_1',
        expected_columns=[
          'Indicador',
          '2do. semestre 2016',
          '1er. semestre 2017', '2do. semestre 2017',
          '1er. semestre 2018', '2do. semestre 2018',
          '1er. semestre 2019', '2do. semestre 2019 (1)',
          '1er semestre 2020', '2do. semestre 2020 (2)',
          '1er. semestre 2021', '2do. semestre 2021',
          '1er. semestre 2022', '2do. semestre 2022',
          '1er. semestre 2023', '2do. semestre 2023',
          '1er. semestre 2024', '2do semestre 2024',
          '1er. semestre 2025', '2do. semestre 2025',
          '1er. semestre 2026*'
        ],
        # `Indicador` es lo único que la serie no puede perder. Si INDEC cambia
        # el nombre de un semestre, ese se proyecta NULL y el `IS NOT NULL` de
        # abajo lo descarta, sin vaciar el mart.
        require_columns=['Indicador']
    ) }} sub
  )
  SELECT
    NULLIF(TRIM("Indicador"), '')        AS indicador,
    v.periodo                            AS periodo,
    {{ to_numeric('v.valor') }}      AS valor
  FROM src
  CROSS JOIN LATERAL (VALUES
    ('2do. semestre 2016',     src."2do. semestre 2016"),
    ('1er. semestre 2017',     src."1er. semestre 2017"),
    ('2do. semestre 2017',     src."2do. semestre 2017"),
    ('1er. semestre 2018',     src."1er. semestre 2018"),
    ('2do. semestre 2018',     src."2do. semestre 2018"),
    ('1er. semestre 2019',     src."1er. semestre 2019"),
    ('2do. semestre 2019',     src."2do. semestre 2019 (1)"),
    ('1er. semestre 2020',     src."1er semestre 2020"),
    ('2do. semestre 2020',     src."2do. semestre 2020 (2)"),
    ('1er. semestre 2021',     src."1er. semestre 2021"),
    ('2do. semestre 2021',     src."2do. semestre 2021"),
    ('1er. semestre 2022',     src."1er. semestre 2022"),
    ('2do. semestre 2022',     src."2do. semestre 2022"),
    ('1er. semestre 2023',     src."1er. semestre 2023"),
    ('2do. semestre 2023',     src."2do. semestre 2023"),
    ('1er. semestre 2024',     src."1er. semestre 2024"),
    ('2do. semestre 2024',     src."2do semestre 2024"),
    ('1er. semestre 2025',     src."1er. semestre 2025"),
    ('2do. semestre 2025',     src."2do. semestre 2025"),
    ('1er. semestre 2026',     src."1er. semestre 2026*")
  ) AS v(periodo, valor)
  WHERE NULLIF(TRIM("Indicador"), '') IS NOT NULL
    AND {{ to_numeric('v.valor') }} IS NOT NULL

refresh:
  policy: on_upstream_change
  unique_index: []

expectations:
  min_rows: 72
