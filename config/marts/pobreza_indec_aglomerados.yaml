id: pobreza_indec_aglomerados
version: 0.3.0
description: |
  Incidencia semestral de la pobreza y la indigencia en hogares y personas,
  total de los 31 aglomerados urbanos, publicada por INDEC en su Informe
  Técnico (Cuadro 1). Desde el 2do semestre de 2016.

  `medida` vale `pobreza` o `indigencia`; `indicador`, `Hogares` o `Personas`.
  Cada fila es un valor de una medida, un indicador y un semestre.
domain: economia

sources:
  portals: [indec]
  resource_patterns:
    - "indec::*pobreza_informe_cuadro_1"

canonical_columns:
  - name: medida
    type: text
    description: "`pobreza` o `indigencia` (la fila de título de cada bloque del Excel, `seccion` en raw)"
  - name: indicador
    type: text
    description: "`Hogares` o `Personas` (`Indicador` en raw)"
  - name: periodo
    type: text
    description: Semestre del registro (e.g. `2do. semestre 2016`, `1er. semestre 2025`)
  - name: valor
    type: numeric
    description: Porcentaje publicado por INDEC para esa medida, indicador y período.

sql: |
  -- El Excel trae un período por columna y `ingest_indec` lo pasa a formato largo
  -- (`_unpivot_semesters`): un semestre nuevo son filas, no una columna que frene
  -- la carga ni haya que agregar acá. Los rótulos cambian de una edición a otra
  -- (`1er semestre 2020`, `2do. semestre 2019 (1)`, el asterisco del dato más
  -- nuevo), así que se normalizan para que cada semestre tenga uno solo.
  --
  -- Lee la hoja por su nombre. Antes matcheaba las 17 `indec__…informe_de_pobreza…`,
  -- que el colector había llenado con la primera hoja del archivo: daba bien por
  -- esa casualidad, y quedó congelado en la edición de mayo. Hoy esas tablas no
  -- se escriben más (`application/catalog/carga_propia.py`).
  WITH src AS (
    SELECT * FROM {{ live_tables_by_table_pattern(
        'cache_indec_pobreza_informe_cuadro_1',
        expected_columns=['seccion', 'Indicador', 'periodo', 'valor'],
        require_columns=['seccion', 'Indicador', 'periodo', 'valor']
    ) }} sub
  )
  SELECT
    lower(TRIM("seccion"))               AS medida,
    NULLIF(TRIM("Indicador"), '')        AS indicador,
    regexp_replace(TRIM("periodo"), '^(1er|2do)\.?\s+semestre\s+(\d{4}).*$', '\1. semestre \2') AS periodo,
    {{ to_numeric('"valor"') }}      AS valor
  FROM src
  WHERE NULLIF(TRIM("Indicador"), '') IS NOT NULL
    AND {{ to_numeric('"valor"') }} IS NOT NULL

refresh:
  policy: on_upstream_change
  unique_index: []

expectations:
  min_rows: 72
