id: presupuesto_nacional_ejecutado
version: 0.2.0
description: |
  Presupuesto de la Administración Pública Nacional argentina —
  ejecución mensual con jerarquía clasificatoria completa
  (jurisdicción × servicio × programa × subprograma × proyecto ×
  actividad × obra) y los 3 momentos del crédito
  (presupuestado / vigente / devengado).

  Source: 32 versiones de
  `datos_gob_ar__presupuesto_de_la_administracion_publica` con la
  shape de TABLA DE HECHOS FULL (33 cols). El mismo cluster tiene
  otras sub-shapes que son tablas de DIMENSIONES (tipo/clase,
  finalidad/función, fuente_financiamiento, etc.) — esas no se
  incluyen acá. Esta es la GRANULAR fact view, una row por
  (mes × jurisdicción × ... × clasificador económico × inciso ×
  partida).

  Clasificador económico 8 dígitos cubre la cadena completa
  (inciso_id → principal_id → parcial_id → subparcial_id) que
  identifica cada partida específica del gasto público.

  Use cases típicos: "ejecución del presupuesto nacional",
  "qué jurisdicciones gastaron más", "presupuesto del Ministerio
  de Salud nacional", "evolución del crédito vigente Educación",
  "gasto en personal del estado nacional", "fuente de
  financiamiento por programa", "obras públicas presupuesto
  nacional".
domain: gobierno

sources:
  portals: [datos_gob_ar]
  resource_patterns: ["datos_gob_ar__presupuesto_de_la_administracion_pu*"]

canonical_columns:
  - name: anio
    type: int
    description: Año de impacto presupuestario
  - name: mes
    type: int
    description: Mes de impacto presupuestario
  - name: jurisdiccion_id
    type: text
    description: ID de la jurisdicción (ministerio o secretaría)
  - name: jurisdiccion_desc
    type: text
    description: Nombre de la jurisdicción
  - name: servicio_id
    type: text
    description: ID del servicio administrativo
  - name: servicio_desc
    type: text
    description: Nombre del servicio
  - name: programa_id
    type: text
    description: ID del programa presupuestario
  - name: programa_desc
    type: text
    description: Nombre del programa
  - name: subprograma_desc
    type: text
    description: Nombre del subprograma (cuando aplica)
  - name: actividad_desc
    type: text
    description: Actividad específica
  - name: obra_desc
    type: text
    description: Obra (para inversión real)
  - name: fuente_financiamiento_desc
    type: text
    description: Fuente de financiamiento (Tesoro Nacional, recursos propios, etc.)
  - name: finalidad_funcion_desc
    type: text
    description: Finalidad/función del gasto (educación, salud, defensa, etc.)
  - name: clasificador_economico_desc
    type: text
    description: Clasificador económico 8 dígitos (descripción)
  - name: inciso_desc
    type: text
    description: Inciso del gasto (personal, bienes, servicios, transferencias, etc.)
  - name: principal_desc
    type: text
    description: Partida principal
  - name: parcial_desc
    type: text
    description: Partida parcial
  - name: subparcial_desc
    type: text
    description: Subpartida
  - name: credito_presupuestado
    type: numeric
    description: Crédito presupuestado (sancionado original)
  - name: credito_vigente
    type: numeric
    description: Crédito vigente (post modificaciones)
  - name: credito_devengado
    type: numeric
    description: Crédito devengado (efectivamente ejecutado)

# COBERTURA (corregido 2026-07-26)
# `require_all_columns=True` exigía las 33 columnas y dejaba 36 de 560 tablas
# vivas: 91.299 filas de 15.801.820, el 0,58 % del cluster. El mart se veía
# sano (91k filas, sin error) mientras representaba una fracción del
# presupuesto nacional — y de ahí salieron los rankings incorrectos.
# Medido: 62 tablas más estaban completas salvo por `finalidad_funcion_*`
# (58) o `impacto_presupuestario_mes` (26), columnas que el mart proyecta
# pero que no definen si una fila es un hecho presupuestario.
# `require_columns` filtra por el núcleo que sí lo define; el resto se
# proyecta como NULL cuando falta. Las sub-shapes reales (dimensiones y
# clasificadores, con 0-14 columnas en común) siguen quedando afuera.
sql: |
  -- v0.2.0 (2026-07-26): el SELECT externo reaplica los casts que el macro
  -- fuerza a ::text para poder unir shapes heterogéneas. Antes no lo hacía,
  -- así que los montos quedaban TEXT con formato mixto y cualquier
  -- agregación dependía de que el LLM normalizara a mano (y no lo hacía).
  --
  -- `_num()` inline: los montos vienen de la API en formato es-AR, donde
  -- conviven '32291165' y '9403175,5'. Se quita el punto de miles y se pasa
  -- la coma decimal a punto ANTES de castear. Nunca se descartan filas por
  -- formato: eso sesga los totales.
  --
  -- `anio`: la ingesta dejó pasar '2.022' junto a '2022' (1.602 filas
  -- huérfanas). Se limpia el separador antes de castear a int.
  --
  -- PENDIENTE: las etiquetas todavía duplican por acento ('Universidad
  -- Tecnologica' vs 'Universidad Tecnológica' son dos filas en un ranking).
  -- No se pliega acá porque esta es una vista de HECHOS granular: plegar
  -- cambiaría el texto que se muestra al usuario en todo el mart. La
  -- solución correcta es una columna de agrupación normalizada aparte.
  SELECT
    NULLIF(replace(TRIM(impacto_presupuestario_anio::text), '.', ''), '')::int  AS anio,
    NULLIF(TRIM(impacto_presupuestario_mes::text), '')::int          AS mes,
    NULLIF(TRIM(jurisdiccion_id::text), '')                          AS jurisdiccion_id,
    NULLIF(TRIM(jurisdiccion_desc), '')                              AS jurisdiccion_desc,
    NULLIF(TRIM(servicio_id::text), '')                              AS servicio_id,
    NULLIF(TRIM(servicio_desc), '')                                  AS servicio_desc,
    NULLIF(TRIM(programa_id::text), '')                              AS programa_id,
    NULLIF(TRIM(programa_desc), '')                                  AS programa_desc,
    NULLIF(TRIM(subprograma_desc), '')                               AS subprograma_desc,
    NULLIF(TRIM(actividad_desc), '')                                 AS actividad_desc,
    NULLIF(TRIM(obra_desc), '')                                      AS obra_desc,
    NULLIF(TRIM(fuente_financiamiento_desc), '')                     AS fuente_financiamiento_desc,
    NULLIF(TRIM(finalidad_funcion_desc), '')                         AS finalidad_funcion_desc,
    NULLIF(TRIM(clasificador_economico_8_digitos_desc), '')          AS clasificador_economico_desc,
    NULLIF(TRIM(inciso_desc), '')                                    AS inciso_desc,
    NULLIF(TRIM(principal_desc), '')                                 AS principal_desc,
    NULLIF(TRIM(parcial_desc), '')                                   AS parcial_desc,
    NULLIF(TRIM(subparcial_desc), '')                                AS subparcial_desc,
    NULLIF(replace(replace(TRIM(credito_presupuestado::text), '.', ''), ',', '.'), '')::numeric
                                                                     AS credito_presupuestado,
    NULLIF(replace(replace(TRIM(credito_vigente::text), '.', ''), ',', '.'), '')::numeric
                                                                     AS credito_vigente,
    NULLIF(replace(replace(TRIM(credito_devengado::text), '.', ''), ',', '.'), '')::numeric
                                                                     AS credito_devengado
  FROM {{ live_tables_by_table_pattern(
      'datos_gob_ar__presupuesto_de_la_administracion_pu*',
      expected_columns=[
        'impacto_presupuestario_anio', 'impacto_presupuestario_mes',
        'jurisdiccion_id', 'jurisdiccion_desc',
        'servicio_id', 'servicio_desc',
        'programa_id', 'programa_desc',
        'subprograma_id', 'subprograma_desc',
        'proyecto_id', 'proyecto_desc',
        'actividad_id', 'actividad_desc',
        'obra_id', 'obra_desc',
        'fuente_financiamiento_id', 'fuente_financiamiento_desc',
        'finalidad_funcion_id', 'finalidad_funcion_desc',
        'clasificador_economico_8_digitos_id', 'clasificador_economico_8_digitos_desc',
        'inciso_id', 'inciso_desc',
        'principal_id', 'principal_desc',
        'parcial_id', 'parcial_desc',
        'subparcial_id', 'subparcial_desc',
        'credito_presupuestado', 'credito_vigente', 'credito_devengado'
      ],
      require_columns=[
        'impacto_presupuestario_anio', 'jurisdiccion_desc',
        'credito_vigente', 'credito_devengado'
      ]
  ) }} sub
  WHERE NULLIF(TRIM(jurisdiccion_desc), '') IS NOT NULL

refresh:
  policy: manual
  unique_index: []

# Retirado del serving el 2026-07-26 tras servir un ranking de transferencias
# a universidades incorrecto por órdenes de magnitud y con las posiciones
# cambiadas. Tres defectos concurrentes, todos verificados contra staging:
#   1. Los montos (credito_*) se materializan como TEXT con formatos mixtos
#      (enteros planos junto a comas decimales), así que cualquier agregación
#      exige normalizar a mano y es fácil de hacer mal.
#   2. `anio` es TEXT y contiene '2.022' además de '2022' — 1.602 filas quedan
#      huérfanas de cualquier agrupación por año.
#   3. `require_all_columns=True` reduce el cluster de 560 tablas vivas a ~32,
#      en silencio: la cobertura por año es de 62k filas para 2023 contra 12k
#      para 2024. El mart no representa el presupuesto nacional completo.
# Mientras tanto `presupuesto_consolidado` cubre el dominio con tipos correctos
# (anio integer, montos numeric) y los 11 ejercicios.
# Desbloquear SOLO después de arreglar los tres puntos y validar contra
# presupuestoabierto.gob.ar.
serving:
  blocked: true
  blocked_reason: >-
    Montos TEXT con formato mixto, anio corrupto ('2.022') y cobertura parcial
    (32 de 560 tablas del cluster). Produjo un ranking de transferencias
    incorrecto. Usar presupuesto_consolidado hasta que se limpie.
