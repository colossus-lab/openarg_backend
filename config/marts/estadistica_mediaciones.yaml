id: estadistica_mediaciones
version: 0.2.0
description: |
  Estadística agregada de mediaciones prejudiciales y judiciales, agrupada
  por (año, mes, instancia, fuero, objeto, tema, tipo, estado, resultado).
  Cada fila es un conteo agregado — Ministerio de Justicia.

  Complementa `mediaciones_prejudiciales` (que es el listado nominal):
  esta vista provee la métrica para análisis temporal/secorial sin
  necesidad de scanear 50M filas.

  **Sirve la publicación vigente, no la unión de las 18 anteriores.** El
  patrón matchea 22 tablas vivas que son snapshots sucesivos de la misma
  serie: ocho tamaños distintos (44.115, 47.982, 54.139, 60.265, 66.620,
  79.456 y 81.372 filas) cada uno duplicado como espejo entre `justicia` y
  `datos_gob_ar`, más dos tablas de 620.554 filas que traen sólo 72.266
  claves — 8,6 copias de cada una. La versión 0.1.0 las unía todas y servía
  1.030.642 filas con **83.301 claves reales: 90,6 % duplicadas**, y peor,
  **10.223 claves con cantidades en conflicto** porque los snapshots
  sucesivos revisan los números. Cualquier conteo de mediaciones salía
  inflado y, en 10.223 casos, indeterminado.

  Ahora toma por identidad el snapshot que el portal actualizó último
  (2026-08-03): 81.372 filas, 81.372 claves, cero duplicadas.

  **Lo que se resigna al hacerlo.** Los snapshots viejos tienen entre 252 y
  476 claves cada uno que el actual ya no incluye — categorizaciones que la
  serie fusionó o renombró al revisarse. No son datos faltantes sino una
  taxonomía anterior, y mezclarlas con la vigente es lo que producía los
  conflictos. Si alguien necesita la serie histórica con sus categorías de
  época, están en el sandbox sobre `raw`.
domain: gobierno

sources:
  portals: [datos_gob_ar, justicia]
  resource_patterns:
    - "justicia::249b3214-411f-4fe5-9600-59b44ef7ec06"

canonical_columns:
  - name: anio
    type: text
    description: Año
  - name: mes
    type: text
    description: Mes
  - name: instancia
    type: text
    description: Instancia (prejudicial / judicial)
  - name: fuero
    type: text
    description: Fuero
  - name: objeto
    type: text
    description: Objeto de la mediación
  - name: tema
    type: text
    description: Tema
  - name: tipo_mediacion
    type: text
    description: Tipo de mediación
  - name: estado
    type: text
    description: Estado
  - name: resultado
    type: text
    description: Resultado
  - name: cantidad
    type: numeric
    description: Cantidad agregada

sql: |
  SELECT
    NULLIF(TRIM(anio::text), '')           AS anio,
    NULLIF(TRIM(mes::text), '')            AS mes,
    NULLIF(TRIM(instancia::text), '')      AS instancia,
    NULLIF(TRIM(fuero::text), '')          AS fuero,
    NULLIF(TRIM(objeto::text), '')         AS objeto,
    NULLIF(TRIM(tema::text), '')           AS tema,
    NULLIF(TRIM(tipo_mediacion::text), '') AS tipo_mediacion,
    NULLIF(TRIM(estado::text), '')         AS estado,
    NULLIF(TRIM(resultado::text), '')      AS resultado,
    -- Guard antes del cast: un `::numeric` crudo sobre un texto que aparezca
    -- en una publicación futura deja el mart en `build_failed`.
    CASE WHEN cantidad::text ~ '^-?[0-9]+(\.[0-9]+)?$'
         THEN cantidad::text::numeric END       AS cantidad
  FROM {{ live_table('justicia::249b3214-411f-4fe5-9600-59b44ef7ec06',
      expected_columns=['anio', 'mes', 'instancia', 'fuero', 'objeto',
                        'tema', 'tipo_mediacion', 'estado', 'resultado',
                        'cantidad']) }} sub
  WHERE NULLIF(TRIM(anio::text), '') IS NOT NULL

refresh:
  policy: on_upstream_change
  unique_index: []

sample_queries:
  - "cuántas mediaciones prejudiciales hubo"
  - "resultados de las mediaciones por fuero"
  - "cuántos acuerdos se lograron en mediación"

expectations:
  # La mitad de las 81.372 filas de la publicación vigente. No existía piso, y
  # ninguno por tamaño podría haber detectado el defecto anterior: 1.030.642
  # filas parecen salud. Si la identidad del recurso se regenera, la rama cae a
  # cero por `expected_columns` y el mart queda vacío y visible.
  min_rows: 40686
