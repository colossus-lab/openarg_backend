id: legisladores_argentina
version: 0.4.0
description: |
  Legisladores del Congreso Nacional argentino — diputados y senadores
  con su bloque, distrito/provincia y partido. Sources: Cámara de
  Diputados (bloques publicados) + Senado de la Nación (listado oficial).
  328 legisladores: 256 diputados + 72 senadores.

  Build basado en analytics de prod (47 días, 42 hits): preguntas como
  "qué bloques hay en Diputados", "senadores por provincia",
  "legisladores del partido X", "quién representa a Tucumán", caen en
  ambos datasets. El mart unifica el universo legislativo en un solo
  surface.

  Diferencia con `mart.legislatura_actividad`: ese cubre la ACTIVIDAD
  (sesiones, votaciones, proyectos). Este cubre LA GENTE (quiénes son,
  por dónde, en qué bloque).
domain: gobierno

sources:
  portals: [diputados, senado]
  resource_patterns:
    - "diputados::*bloques*"
    - "senado::listado_senadores"

canonical_columns:
  - name: camara
    type: text
    description: "diputados | senadores"
  - name: apellido
    type: text
    description: Apellido
  - name: nombre
    type: text
    description: Nombre
  - name: distrito_provincia
    type: text
    description: Distrito (diputados) o Provincia (senadores)
  - name: bloque
    type: text
    description: Bloque parlamentario
  - name: partido_o_alianza
    type: text
    description: Partido / alianza (sólo populated para senadores)
  - name: periodo
    type: text
    description: Período legislativo (sólo populated para diputados)

# UNION ALL canonicaliza nombres distintos entre las 2 fuentes.
# v0.2.0: diputados migrado de `cache_*` a `raw.*` via macro
# (DEBT-019-006). El raw usa col `NOMBRES` (plural) y carece de
# `INTERBLOQUE` — partido_o_alianza queda NULL para diputados.
# Senadores sigue en cache_* (no hay equivalente raw aún —
# requiere migración del connector).
sql: |
  -- DISTINCT, no por prolijidad: el portal publica el MISMO padrón bajo dos
  -- resource_identity distintas (`diputados__bloques__84ff2259__v3` y
  -- `__f3067840__v1`, 256 filas cada una), y el macro une todo lo que matchea
  -- el patrón. Sin esto cada diputado sale dos veces y el mart devuelve 512
  -- donde hay 256 — que es exactamente lo que el chat venía contestando.
  -- Va DISTINCT y no un identity fijo porque nada impide que el portal
  -- publique una tercera copia mañana.
  SELECT DISTINCT
    'diputados'::text                            AS camara,
    NULLIF(TRIM("APELLIDO"::text), '')           AS apellido,
    NULLIF(TRIM("NOMBRES"::text), '')            AS nombre,
    NULLIF(TRIM("DISTRITO"::text), '')           AS distrito_provincia,
    NULLIF(TRIM("BLOQUE"::text), '')             AS bloque,
    NULL::text                                   AS partido_o_alianza,
    NULLIF(TRIM("PERIODO"::text), '')            AS periodo
  FROM {{ live_tables_by_table_pattern(
      'diputados__bloques*',
      expected_columns=['BLOQUE', 'APELLIDO', 'NOMBRES', 'DISTRITO', 'PERIODO'],
      require_all_columns=True
  ) }} sub_dip
  WHERE NULLIF(TRIM("APELLIDO"::text), '') IS NOT NULL

  UNION ALL

  SELECT
    'senadores'::text                            AS camara,
    NULLIF(TRIM("APELLIDO"), '')                 AS apellido,
    NULLIF(TRIM("NOMBRE"), '')                   AS nombre,
    NULLIF(TRIM("PROVINCIA"), '')                AS distrito_provincia,
    NULLIF(TRIM("BLOQUE"), '')                   AS bloque,
    NULLIF(TRIM("PARTIDO O ALIANZA"), '')        AS partido_o_alianza,
    NULL::text                                   AS periodo
  FROM {{ live_table('senado::listado_senadores') }}
  WHERE NULLIF(TRIM("APELLIDO"), '') IS NOT NULL

refresh:
  policy: manual
  # Con esto una duplicación futura hace fallar el build en vez de doblar el
  # número calladita. El DISTINCT de arriba arregla el caso de hoy; el índice
  # es lo que hace que no vuelva sin que nos enteremos.
  unique_index: [camara, apellido, nombre, distrito_provincia, periodo]

expectations:
  min_rows: 300
