id: series_economicas
version: 0.4.0
description: |
  COTIZACIONES CAMBIARIAS DEL BCRA — tipos de cambio de unas 39 monedas
  extranjeras contra el peso argentino, del último día hábil publicado por el
  Banco Central, con su fecha (`fecha`).

  Incluye la fila REF ("DOLAR REFERENCIA COM 3500"): el tipo de cambio
  mayorista de referencia oficial del BCRA (Comunicación A 3500). NO incluye
  el dólar minorista, el blue ni índices económicos (IPC, EMAE, reservas):
  esos salen de la API de variables del BCRA y de Series de Tiempo. El nombre
  del mart se mantiene como `series_economicas` por compatibilidad con el
  embedding poblado y el discovery del LLM, pero cubre SOLO el sub-dominio
  "tipo_de_cambio".

  La historia diaria completa está en la tabla raw (una fila por fecha y
  moneda); este mart muestra sólo la última fecha, una fila por moneda.
domain: economia
# Subdominio efectivo para el LLM router. Esto es lo que el planner
# debería ver para no recomendar este mart a queries de IPC/EMAE.
# (No es un campo nativo del mart loader hoy; vive como pista
# semántica para el embedding de discovery.)

sources:
  portals: [bcra]
  resource_patterns: ["bcra::cotizaciones"]

canonical_columns:
  - name: serie_id
    type: text
    description: Código de la moneda (USD, EUR, BRL, REF = dólar de referencia Com. A 3500) — PK lógica
  - name: descripcion
    type: text
    description: Nombre legible (e.g. "DOLAR EE.UU.", "EURO")
  - name: valor
    type: float
    description: Cotización contra el peso argentino del día `fecha`, publicada por el BCRA
  - name: fecha
    type: date
    description: Día hábil al que corresponde la cotización (el último publicado)
  - name: unidad
    type: text
    description: Siempre "cotizacion_cambiaria" — qué tipo de serie es
  - name: fuente
    type: text
    description: Siempre "BCRA" hoy

sql: |
  -- v0.4.0: la tabla raw acumula historia (una fila por fecha y moneda) y
  -- este mart se queda con la última fecha, así sigue siendo una fila por
  -- serie_id. `IS NOT DISTINCT FROM` cubre la transición: mientras la tabla
  -- sea la foto vieja sin fecha (todas NULL), el máximo es NULL y la foto se
  -- sigue sirviendo en vez de dejar el mart vacío.
  -- v0.3.1: expected_columns. Si bcra::cotizaciones desaparece, el mart
  -- construye con 0 rows en vez de fallar con "column codigoMoneda does not
  -- exist".
  WITH src AS (
    SELECT * FROM {{ live_table(
        'bcra::cotizaciones',
        expected_columns=['codigoMoneda', 'descripcion', 'tipoCotizacion', 'fecha']
    ) }} t
    WHERE "codigoMoneda" IS NOT NULL
  )
  SELECT
    "codigoMoneda"::text                         AS serie_id,
    COALESCE(descripcion, '')::text              AS descripcion,
    "tipoCotizacion"::float                      AS valor,
    NULLIF(fecha, '')::date                      AS fecha,
    'cotizacion_cambiaria'::text                 AS unidad,
    'BCRA'::text                                 AS fuente
  FROM src
  WHERE fecha IS NOT DISTINCT FROM (SELECT max(fecha) FROM src)

refresh:
  policy: on_upstream_change

expectations:
  # Las columnas que identifican una fila. Convierte "estas filas se
  # repiten" —que es una sospecha— en una afirmación verificable. Vivía
  # en tests/integration/test_mart_invariants.py, donde sólo corría contra
  # una base con marts construidos y nadie la corría.
  business_key: [serie_id]
