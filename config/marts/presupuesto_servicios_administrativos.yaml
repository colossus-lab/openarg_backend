id: presupuesto_servicios_administrativos
version: 0.1.1
description: |
  Catálogo de servicios administrativos del Presupuesto de la
  Administración Pública Nacional, por ejercicio: sólo nombres y
  códigos (ejercicio, servicio_id, servicio_desc,
  fecha_actualizacion). NO tiene montos.

  Usar para traducir código→descripción de un servicio y para
  listar qué servicios estuvieron operativos en cada ejercicio.
  Para gasto, crédito vigente o devengado por ministerio o
  jurisdicción, el mart es presupuesto_consolidado.
domain: gobierno

sources:
  portals: [datos_gob_ar]
  resource_patterns:
    - "datos_gob_ar::*presupuesto_de_la_administracion_pu*"

canonical_columns:
  - name: ejercicio_presupuestario
    type: text
    description: Ejercicio fiscal (año)
  - name: servicio_id
    type: text
    description: ID del servicio administrativo
  - name: servicio_desc
    type: text
    description: Nombre del servicio
  - name: ultima_actualizacion_fecha
    type: text
    description: Fecha de última actualización del registro upstream

sql: |
  -- Elegimos el snapshot más reciente por clave de negocio para evitar
  -- fanout al joinear contra el fact si el mismo servicio reaparece con
  -- distinta `ultima_actualizacion_fecha`.
  WITH ranked AS (
    SELECT
      NULLIF(TRIM(ejercicio_presupuestario::text), '')   AS ejercicio_presupuestario,
      NULLIF(TRIM(servicio_id::text), '')                AS servicio_id,
      NULLIF(TRIM(servicio_desc), '')                    AS servicio_desc,
      NULLIF(TRIM(ultima_actualizacion_fecha::text), '') AS ultima_actualizacion_fecha,
      ROW_NUMBER() OVER (
        PARTITION BY
          NULLIF(TRIM(ejercicio_presupuestario::text), ''),
          NULLIF(TRIM(servicio_id::text), '')
        ORDER BY NULLIF(TRIM(ultima_actualizacion_fecha::text), '') DESC NULLS LAST
      ) AS rn
    FROM {{ live_tables_by_table_pattern(
        'datos_gob_ar__presupuesto_de_la_administracion_pu*',
        expected_columns=[
          'ejercicio_presupuestario',
          'servicio_id', 'servicio_desc',
          'ultima_actualizacion_fecha'
        ],
        require_all_columns=True
    ) }} sub
    WHERE NULLIF(TRIM(servicio_id::text), '') IS NOT NULL
  )
  SELECT
    ejercicio_presupuestario,
    servicio_id,
    servicio_desc,
    ultima_actualizacion_fecha
  FROM ranked
  WHERE rn = 1

refresh:
  policy: on_upstream_change
  unique_index: []

# v0.1.1: muestras de catálogo, nada de montos. La que estaba cargada a mano
# desde mayo ("ministerios y secretarías presupuesto") le daba a este mart —que
# no tiene un solo peso— el +0.17 del ruteo en cada pregunta de "gasto por
# ministerio" (prod, 29-sep). Al construir, las muestras que no están acá se
# borran.
sample_queries:
  - "catálogo de servicios PEN"
  - "código de servicio administrativo"
  - "lookup servicio presupuestario"
  - "servicios administrativos del presupuesto"
  - "servicios de la administración pública nacional"
